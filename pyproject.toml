[project]
name = "dbmachine"
version = "0.1.0"
description = "Turn a Postgres database into a self-describing, agent-operable application backend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "dbmachine contributors" }]
keywords = ["postgres", "agent", "ai", "backend", "cli", "low-code"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "jsonschema>=4.21",
    "openpyxl>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
dbmachine = "dbmachine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbmachine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: tests requiring a live local Postgres (run with docker up)",
]
